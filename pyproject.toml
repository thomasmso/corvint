[project]
name = "adtech-agents"
version = "0.0.1"
description = "v0: read-only AppLovin MAX integration auditor agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.45.0",
    "openai-agents>=0.24.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "tqdm>=4.67.1",
]

[project.scripts]
adtech = "adtech_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adtech_agents", "src/commons"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-tqdm>=4.70.0.20261102",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["adtech_agents", "commons", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["adtech_agents", "commons"]
plugins = ["pydantic.mypy"]
